name: Build Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > packaging/android-release.keystore
            echo "Using stored signing keystore from secret"
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret — build script will generate a dev keystore"
          fi

      - name: Build Android APK
        run: |
          chmod +x scripts/build-android-docker.sh
          ./scripts/build-android-docker.sh

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hamclock-android
          path: build-android/app/build/outputs/apk/release/app-release.apk

      - name: Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: build-android/app/build/outputs/apk/release/app-release.apk
