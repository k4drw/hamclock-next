name: Build Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Restore signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > packaging/android-release.keystore
            echo "Using stored signing keystore from secret"
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret — build script will generate a dev keystore"
          fi

      - name: Cache Docker image
        uses: actions/cache@v5
        with:
          path: /tmp/docker-cache
          key: docker-android-${{ runner.os }}-${{ hashFiles('scripts/build-android-docker.sh') }}
          restore-keys: docker-android-${{ runner.os }}-

      - name: Load or pull Docker image
        run: |
          if [ -f /tmp/docker-cache/image.tar ]; then
            docker load -i /tmp/docker-cache/image.tar
          else
            docker pull mingc/android-build-box:latest
            mkdir -p /tmp/docker-cache
            docker save mingc/android-build-box:latest -o /tmp/docker-cache/image.tar
          fi

      - name: Build Android APK
        run: |
          chmod +x scripts/build-android-docker.sh
          ./scripts/build-android-docker.sh

      - name: Rename APK
        run: |
          VERSION="v$(cat VERSION | tr -d '[:space:]')"
          EXPECTED="build-android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$EXPECTED" ]; then
            echo "Expected APK not found. APK files in build-android:"
            find build-android -name "*.apk" 2>/dev/null || echo "(none)"
            exit 1
          fi
          cp "$EXPECTED" "hamclock-next_${VERSION}.apk"
          echo "APK_NAME=hamclock-next_${VERSION}.apk" >> $GITHUB_ENV

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: hamclock-android
          path: ${{ env.APK_NAME }}

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: ${{ env.APK_NAME }}