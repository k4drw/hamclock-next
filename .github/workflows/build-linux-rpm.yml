name: Build RPMs

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-rpm-fedora:
    name: Fedora RPM (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache Docker image
        uses: actions/cache@v4
        with:
          path: /tmp/docker-cache
          key: docker-fedora-${{ runner.os }}-${{ hashFiles('scripts/build-rpm-fedora.sh') }}
          restore-keys: docker-fedora-${{ runner.os }}-

      - name: Load or pull Docker image
        run: |
          if [ -f /tmp/docker-cache/image.tar ]; then
            docker load -i /tmp/docker-cache/image.tar
          else
            docker pull fedora:latest
            mkdir -p /tmp/docker-cache
            docker save fedora:latest -o /tmp/docker-cache/image.tar
          fi

      - name: Build Fedora RPM
        run: |
          chmod +x scripts/build-rpm-fedora.sh
          ./scripts/build-rpm-fedora.sh

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hamclock-fedora-rpm
          path: |
            build-rpm/RPMS/**/*.rpm
            build-rpm/SRPMS/**/*.rpm

      - name: Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            build-rpm/RPMS/**/*.rpm
            build-rpm/SRPMS/**/*.rpm

  build-rpm-suse:
    name: OpenSUSE Tumbleweed RPM (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache Docker image
        uses: actions/cache@v4
        with:
          path: /tmp/docker-cache
          key: docker-tumbleweed-${{ runner.os }}-${{ hashFiles('scripts/build-rpm-suse.sh') }}
          restore-keys: docker-tumbleweed-${{ runner.os }}-

      - name: Load or pull Docker image
        run: |
          if [ -f /tmp/docker-cache/image.tar ]; then
            docker load -i /tmp/docker-cache/image.tar
          else
            docker pull registry.opensuse.org/opensuse/tumbleweed:latest
            mkdir -p /tmp/docker-cache
            docker save registry.opensuse.org/opensuse/tumbleweed:latest -o /tmp/docker-cache/image.tar
          fi

      - name: Build OpenSUSE RPM
        run: |
          chmod +x scripts/build-rpm-suse.sh
          ./scripts/build-rpm-suse.sh

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hamclock-opensuse-rpm
          path: |
            build-rpm-suse/RPMS/**/*.rpm
            build-rpm-suse/SRPMS/**/*.rpm

      - name: Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            build-rpm-suse/RPMS/**/*.rpm
            build-rpm-suse/SRPMS/**/*.rpm
