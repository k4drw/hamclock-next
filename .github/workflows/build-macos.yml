name: Build macOS

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: MacOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          brew install sdl2 sdl2_image sdl2_ttf curl

      - name: Build MacOS Binary
        env:
          MACOS_SIGN_MODE: ${{ secrets.MACOS_CODESIGN_IDENTITY != '' && 'auto' || 'adhoc' }}
          MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          MACOS_NOTARIZE: ${{ secrets.MACOS_NOTARY_KEYCHAIN_PROFILE != '' && '1' || '0' }}
          MACOS_NOTARY_KEYCHAIN_PROFILE: ${{ secrets.MACOS_NOTARY_KEYCHAIN_PROFILE }}
        run: |
          chmod +x scripts/build-macos.sh
          ./scripts/build-macos.sh

      - name: Create Distribution Packages
        run: |
          # DMG and ZIP are created by build-macos.sh
          echo "Distribution packages created:"
          ls -lh build-macos/*.dmg build-macos/*.zip

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v7
        with:
          name: hamclock-macos-dmg
          path: build-macos/*.dmg

      - name: Upload ZIP Artifact
        uses: actions/upload-artifact@v7
        with:
          name: hamclock-macos-zip
          path: build-macos/*.zip

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            build-macos/*.dmg
            build-macos/*.zip
