name: Linux Sanitizer Build (Manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  asan-ubsan:
    name: Linux x64 AddressSanitizer + UBSan smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake git pkg-config ca-certificates \
            libx11-dev libxext-dev libxcursor-dev libxi-dev \
            libxrandr-dev libxss-dev libxxf86vm-dev libxinerama-dev \
            libwayland-dev libxkbcommon-dev wayland-protocols \
            libdrm-dev libgbm-dev libegl-dev libgles-dev \
            libdbus-1-dev libudev-dev libasound2-dev flite1-dev curl

      - name: Configure (Debug + ASan + UBSan)
        run: |
          cmake -S . -B build-asan \
            -DCMAKE_BUILD_TYPE=Debug \
            -DENABLE_ASAN=ON \
            -DHAMCLOCK_BUILD_VARIANT=unified

      - name: Build hamclock-next
        run: cmake --build build-asan --target hamclock-next -j$(nproc)

      - name: Smoke test (--help)
        run: |
          ./build-asan/hamclock-next --help

      - name: Smoke test (offscreen boot + quit)
        env:
          SDL_VIDEODRIVER: offscreen
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:abort_on_error=1:print_stacktrace=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          # Run headless for ~10 s to exercise init -> tick -> shutdown under ASan.
          # `timeout --preserve-status` forwards SIGTERM so the app runs its
          # destructors (FccProvider/NetworkManager barriers, etc.).
          timeout --preserve-status --signal=TERM 10 ./build-asan/hamclock-next || rc=$?
          # Exit code 143 = 128 + SIGTERM; treat as success.
          if [ "${rc:-0}" != "0" ] && [ "${rc:-0}" != "143" ]; then
            echo "hamclock-next exited with $rc under sanitizer"
            exit "$rc"
          fi
