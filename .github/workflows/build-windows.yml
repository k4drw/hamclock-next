name: Build Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-win64:
    name: Windows x64 (Static)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Cache Docker image
        uses: actions/cache@v5
        with:
          path: /tmp/docker-cache
          key: docker-win64-${{ runner.os }}-${{ hashFiles('scripts/build-win64.sh') }}
          restore-keys: docker-win64-${{ runner.os }}-

      - name: Load or pull Docker image
        run: |
          if [ -f /tmp/docker-cache/image.tar ]; then
            docker load -i /tmp/docker-cache/image.tar
          else
            docker pull dockcross/windows-static-x64
            mkdir -p /tmp/docker-cache
            docker save dockcross/windows-static-x64 -o /tmp/docker-cache/image.tar
          fi

      - name: Build Windows Executable
        run: |
          chmod +x scripts/build-win64.sh
          ./scripts/build-win64.sh

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: hamclock-win64
          path: |
            build-win64/hamclock-next.exe
            build-win64/HamClock-Next-Setup.exe

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            build-win64/hamclock-next.exe
            build-win64/HamClock-Next-Setup.exe
